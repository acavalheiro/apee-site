name: Deploy ATL Pragal → Azure Storage

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # ── Build ────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Bundle with esbuild
        run: npm run build

      # ── Login ────────────────────────────────────────────────────────────
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Deploy to Test Site ──────────────────────────────────────────────
      - name: Upload to Azure Storage (Test)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            STORAGE_ACCOUNT="${{ secrets.AZURE_ST_TEST_SITE }}"
            CONTAINER="\$web"

            echo "Uploading to test storage account: $STORAGE_ACCOUNT"

            az storage blob upload-batch \
              --account-name "$STORAGE_ACCOUNT" \
              --source "./src" \
              --destination "$CONTAINER" \
              --overwrite true \
              --auth-mode login

            # Fix content types for critical files
            az storage blob update \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "index.html" \
              --content-type "text/html; charset=utf-8" \
              --auth-mode login

            az storage blob update \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "css/styles.css" \
              --content-type "text/css; charset=utf-8" \
              --auth-mode login

            az storage blob update \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "js/main.js" \
              --content-type "application/javascript; charset=utf-8" \
              --auth-mode login

      # ── Deploy to Production ─────────────────────────────────────────────
      - name: Upload to Azure Storage (Production)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            STORAGE_ACCOUNT="${{ secrets.AZURE_STORAGE_ACCOUNT }}"
            CONTAINER="\$web"

            echo "Uploading to production storage account: $STORAGE_ACCOUNT"

            az storage blob upload-batch \
              --account-name "$STORAGE_ACCOUNT" \
              --source "./src" \
              --destination "$CONTAINER" \
              --overwrite true \
              --auth-mode login

            # Fix content types for critical files
            az storage blob update \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "index.html" \
              --content-type "text/html; charset=utf-8" \
              --auth-mode login

            az storage blob update \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "css/styles.css" \
              --content-type "text/css; charset=utf-8" \
              --auth-mode login

            az storage blob update \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$CONTAINER" \
              --name "js/main.js" \
              --content-type "application/javascript; charset=utf-8" \
              --auth-mode login

      - name: Purge Cloudflare Cache
        env:
          CF_ZONE_ID:   ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          echo "Cloudflare response: $RESPONSE"

          SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['success'])")
          if [ "$SUCCESS" != "True" ]; then
            echo "Cloudflare cache purge failed!"
            exit 1
          fi
          echo "Cloudflare cache purged successfully."
